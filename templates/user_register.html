<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<body>
    <form action="{{ url_for('auth.userregister') }}" method="POST">
        <label for="uname">Name: </label>
        <input id="uname" type="text" name="username" placeholder="Enter Username" required><br>
        <label>Email address: </label>
        <input type="email" name="email" placeholder="Enter Email address" required><br>
        <label>Password: </label>
        <input type="password" name="password" placeholder="Enter Password" required><br>
        <label>I am a: </label>
        <select name="role" required>
            <option selected disabled>None</option>
            <option value="staff">Staff Member</option>
            <option value="trekker">User(Trekker)</option>
        </select>
        <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="{{ url_for('auth.login') }}">Click here to login</a></p>
</body>
</html>
